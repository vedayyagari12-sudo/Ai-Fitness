name: physiqo_ai
description: "Physiqo AI — AI-guided training, physique scanning and calorie tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  # Already pulled in by supabase_flutter; declared directly so the app can
  # tell a deep-link sign-in apart from a password sign-in.
  app_links: ^7.0.0
  supabase_flutter: ^2.3.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  permission_handler: ^11.4.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/
