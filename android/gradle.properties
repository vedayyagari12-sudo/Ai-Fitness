# Kotlin normally compiles in its own daemon JVM, on top of the Gradle daemon.
# Combined with an oversized heap here that exhausted memory and the Kotlin
# daemon died mid-build ("Failed connecting to the daemon in 4 retries"),
# failing the release build. Compiling in-process keeps it to a single JVM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
